# Socle complet dockerisé : `docker compose up --build`
#   - postgres : base de données (schéma appliqué automatiquement au 1er démarrage)
#   - api      : API FastAPI (REST + SSE)         -> http://localhost:8000/docs
#   - worker   : pipeline planifié (APScheduler)  -> collecte + sentiment + alerting
# (Pas de service dashboard : techno réservée au choix de l'équipe.)

services:
  postgres:
    # Version paramétrable : sur un serveur mutualisé où le DNS des
    # conteneurs peut être capricieux, mieux vaut réutiliser une image
    # Postgres déjà en cache localement (`docker images`) que forcer un
    # téléchargement. Nos migrations n'utilisent rien de spécifique à une
    # version mineure précise.
    image: postgres:${POSTGRES_VERSION:-15-alpine}
    container_name: sentiment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-telecom_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-telecom_password}
      POSTGRES_DB: ${DB_NAME:-telecom_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Lié à la boucle locale, PAS à 0.0.0.0 : seuls l'API et le worker ont
      # besoin de la base, et ils passent par le réseau interne du compose. Un
      # « 5432:5432 » nu la publie sur toutes les interfaces — sur un serveur
      # de test partagé, c'est une base exposée au réseau. Le port reste
      # joignable depuis la machine hôte pour psql et les sauvegardes.
      #
      # Port hôte paramétrable (DB_HOST_PORT) : sur un serveur mutualisé, 5432
      # est presque toujours déjà pris par un autre projet — le port interne
      # du conteneur (5432) ne change jamais, seul le mapping hôte varie.
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # PAS de montage vers /docker-entrypoint-initdb.d : ce mécanisme
      # exécute tous les .sql en aveugle au premier démarrage, sans rien
      # enregistrer nulle part, alors que `apply_schema()` (reviews/storage/
      # db.py) tient déjà sa propre table `schema_migrations` et applique
      # chaque migration exactement une fois, de façon fiable. Les deux en
      # même temps sur une base neuve = double exécution : Postgres rejoue la
      # 009 (renomme place_id -> target_id) sans le noter, puis apply_schema()
      # la rejoue à son tour croyant que rien n'a encore été appliqué, et
      # plante sur "column already exists". Découvert au premier déploiement
      # sur un volume réellement neuf (jamais vu en local, où le volume existe
      # depuis avant l'ajout de ce montage).
    healthcheck:
      # -d obligatoire : sans base cible, pg_isready se connecte à une base
      # homonyme de l'utilisateur ("telecom_user"), inexistante -> le log se
      # remplit de « FATAL: database "telecom_user" does not exist » toutes les
      # 10 s (le check passe quand même, mais le bruit est trompeur).
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-telecom_user} -d ${DB_NAME:-telecom_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sentiment_net]

  api:
    build: .
    # Nom d'image fixe, indépendant du nom du dossier : `docker compose`
    # dérive sinon le nom d'image du dossier parent (analyse_de_sentiment en
    # local, sentiment-backend sur le serveur de test) — un `docker save` /
    # `docker load` entre les deux ne retrouverait pas la même image.
    image: sentiment-app:latest
    container_name: sentiment-api
    restart: unless-stopped
    command: ["python", "-m", "reviews", "serve"]
    env_file: .env
    environment:
      DB_HOST: postgres
    ports:
      # Lié à la boucle locale : sur le serveur de test, c'est un reverse
      # proxy nginx (pas ce port) qui reçoit le trafic public. Port hôte
      # paramétrable (API_HOST_PORT) pour la même raison que Postgres
      # ci-dessus.
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [sentiment_net]

  worker:
    build: .
    image: sentiment-app:latest
    container_name: sentiment-worker
    restart: unless-stopped
    command: ["python", "-m", "reviews", "schedule"]
    env_file: .env
    environment:
      DB_HOST: postgres
      ENABLE_SCHEDULER: "true"
    volumes:
      - review_state:/app/data/state   # persiste l'état de session des scrapers
    depends_on:
      postgres:
        condition: service_healthy
    networks: [sentiment_net]

volumes:
  postgres_data:
  review_state:

networks:
  sentiment_net:
    driver: bridge
    driver_opts:
      # MTU forcé sur NOTRE réseau uniquement, indépendant de la config
      # globale du démon Docker (/etc/docker/daemon.json, partagée par tous
      # les projets du serveur). Mesuré le 27/08/2026 sur digiwise-4 : le
      # vrai MTU du chemin réseau est entre 1428 et 1500 (`ping -M do -s
      # <taille>` échoue à 1472, réussit à 1400) — 1500 (le défaut) fait
      # perdre silencieusement les grosses réponses HTTPS ("Read timed out",
      # symptôme classique d'un trou de fragmentation/PMTU). 1400 est une
      # valeur sûre, confortablement sous la vraie limite.
      com.docker.network.driver.mtu: "1400"
