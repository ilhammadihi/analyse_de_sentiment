# Socle complet dockerisé : `docker compose up --build`
#   - postgres : base de données (schéma appliqué automatiquement au 1er démarrage)
#   - api      : API FastAPI (REST + SSE)         -> http://localhost:8000/docs
#   - worker   : pipeline planifié (APScheduler)  -> collecte + sentiment + alerting
# (Pas de service dashboard : techno réservée au choix de l'équipe.)

services:
  postgres:
    image: postgres:15-alpine
    container_name: reviews_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-telecom_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-telecom_password}
      POSTGRES_DB: ${DB_NAME:-telecom_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schéma appliqué automatiquement à la création de la base
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-telecom_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [reviews_net]

  api:
    build: .
    container_name: reviews_api
    restart: unless-stopped
    command: ["python", "-m", "reviews", "serve"]
    env_file: .env
    environment:
      DB_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [reviews_net]

  worker:
    build: .
    container_name: reviews_worker
    restart: unless-stopped
    command: ["python", "-m", "reviews", "schedule"]
    env_file: .env
    environment:
      DB_HOST: postgres
      ENABLE_SCHEDULER: "true"
    volumes:
      - review_state:/app/data/state   # persiste l'état de session des scrapers
    depends_on:
      postgres:
        condition: service_healthy
    networks: [reviews_net]

volumes:
  postgres_data:
  review_state:

networks:
  reviews_net:
    driver: bridge
